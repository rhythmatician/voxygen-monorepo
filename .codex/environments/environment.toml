# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "voxygen-monorepo"

[setup]
script = """
set -euo pipefail

echo "[setup] Installing system dependencies..."
sudo apt-get update -qq
sudo apt-get install -y -qq jq libegl1 2>&1 | tail -n 20

echo "[setup] Ensuring Node 22..."
if ! command -v node >/dev/null 2>&1 || ! node --version | grep -q "v22"; then
  curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null 2>&1
  sudo apt-get install -y nodejs
fi
node --version
npm --version

echo "[setup] Installing Node dependencies..."
npm ci

echo "[setup] Ensuring uv 0.8.8..."
if ! command -v uv >/dev/null 2>&1 || ! uv --version | grep -q "0.8.8"; then
  curl -LsSf https://astral.sh/uv/install.sh | sh -s -- --version 0.8.8 >/dev/null 2>&1
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
fi
export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
uv --version

echo "[setup] Verifying locked Python environment..."
uv lock --project python --check

echo "[setup] Syncing Python environment (dev + test + type_stubs)..."
uv sync --project python --locked --group dev --extra test --extra type_stubs

echo "[setup] Verifying pinned Voxy artifact..."
bash .ci/install-voxy.sh verify

echo "[setup] Installing Voxy artifact to java/mods..."
bash .ci/install-voxy.sh install

echo "[setup] Ensuring Java 21..."
if ! java -version 2>&1 | grep -q "21"; then
  sudo apt-get install -y openjdk-21-jdk 2>&1 | tail -n 20
fi
java -version 2>&1 | head -n 1

echo "[setup] Preparing Gradle wrapper..."
chmod +x java/gradlew

echo "[setup] Done."
"""

[setup.win32]
script = """
Set-StrictMode -Version Latest
$ErrorActionPreference = "Stop"

Write-Host "[setup.win32] Windows environment setup..."

# Node 22 - Codex Windows images may already have Node; ensure version
try { node --version; npm --version } catch { Write-Host "Installing Node 22..."; winget install OpenJS.NodeJS.LTS --version 22 --silent }

Write-Host "[setup.win32] Installing Node dependencies..."
# devEngines in package.json enforces os=linux; Windows Codex envs should still install
# for isolated Windows runs. WSL users should use the default [setup] instead.
npm ci

Write-Host "[setup.win32] Ensuring uv 0.8.8..."
try { uv --version } catch { powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex" }
uv --version

Write-Host "[setup.win32] Syncing Python environment..."
uv lock --project python --check
uv sync --project python --locked --group dev --extra test --extra type_stubs

Write-Host "[setup.win32] Verifying Voxy artifact (requires jq + sha256sum)..."
bash .ci/install-voxy.sh verify
bash .ci/install-voxy.sh install

Write-Host "[setup.win32] Java 21 required - ensure Temurin 21 is on PATH"
java -version

Write-Host "[setup.win32] Done."
"""

[cleanup]
script = """
set -euo pipefail
echo "[cleanup] Removing ephemeral build outputs..."

# Voxy artifact copy installed to java/mods by .ci/install-voxy.sh install
rm -rf java/mods/voxy-*.jar

# Gradle build outputs
rm -rf java/build
rm -rf java/.gradle

# Python ephemeral env (lockfile preserved)
rm -rf python/.venv

# Node ephemeral (keep cache, remove only if present)
# rm -rf node_modules

echo "[cleanup] Done."
"""
