# Codex environment - declarative; edits via PR review (Codex may regenerate unsynced fields)
# Note: [setup] (bash) and [setup.win32] (PowerShell) intentionally duplicate pinned versions
# (Node 22, uv 0.8.8, Java 21, libegl1, Voxy artifact) - shells are disjoint, so extraction would couple them.
version = 1
name = "voxygen-monorepo"

[setup]
script = """
set -euo pipefail

echo "[setup] Installing system dependencies..."
sudo apt-get update -qq
sudo apt-get install -y -qq jq libegl1 2>&1 | tail -n 20

echo "[setup] Ensuring Node 22..."
if ! command -v node >/dev/null 2>&1 || ! node --version | grep -q "v22"; then
  curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null 2>&1
  sudo apt-get install -y nodejs
fi
node --version
npm --version

echo "[setup] Installing Node dependencies..."
npm ci

echo "[setup] Ensuring uv 0.8.8..."
if ! command -v uv >/dev/null 2>&1 || ! uv --version | grep -q "0.8.8"; then
  curl -LsSf https://astral.sh/uv/install.sh | sh -s -- --version 0.8.8 >/dev/null 2>&1
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
fi
export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
uv --version

echo "[setup] Verifying locked Python environment..."
uv lock --project python --check

echo "[setup] Syncing Python environment (dev + test + type_stubs)..."
uv sync --project python --locked --group dev --extra test --extra type_stubs

echo "[setup] Verifying pinned Voxy artifact..."
bash .ci/install-voxy.sh verify

echo "[setup] Installing Voxy artifact to java/mods..."
bash .ci/install-voxy.sh install

echo "[setup] Ensuring Java 21..."
if ! java -version 2>&1 | grep -q "21"; then
  sudo apt-get install -y openjdk-21-jdk 2>&1 | tail -n 20
fi
java -version 2>&1 | head -n 1

echo "[setup] Preparing Gradle wrapper..."
chmod +x java/gradlew

echo "[setup] Done."
"""

[setup.win32]
script = '''
Set-StrictMode -Off
$ErrorActionPreference = "Stop"
# FIX: StrictMode breaks C:\Program Files\nodejs\npm.ps1 ($MyInvocation.Statement) - use npm.cmd

Write-Host "[setup.win32] Windows environment setup..."

# Node 22 - ensure exact v22 with accept flags; reinstalls if non-22 version present
$needNode = $true
try {
  $v = (node --version 2>$null)
  if ($v -match "v22\.") { $needNode = $false; Write-Host "Node $v already satisfies v22" }
  else { Write-Host "Node $v does not satisfy v22, will reinstall" }
} catch { Write-Host "Node not found, will install v22" }
if ($needNode) {
  Write-Host "Installing Node 22..."
  winget install --id OpenJS.NodeJS.LTS --version 22 --silent --accept-package-agreements --accept-source-agreements
  $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
}
node --version
$nodeVer = (node --version)
if (-not ($nodeVer -match "v22\.")) { throw "Node 22 required, found $nodeVer" }
npm.cmd --version

Write-Host "[setup.win32] Node project is cross-platform (devEngines.os=linux,win32 onFail=warn) - see package.json devEngines"
Write-Host "[setup.win32] Installing Node dependencies (npm.cmd ci) - previously WSL-only, now enabled for cross-platform dev"
npm.cmd ci

Write-Host "[setup.win32] Ensuring uv 0.8.8..."
$needUv = $true
try {
  $uvVer = (uv --version 2>$null)
  if ($uvVer -match "0\.8\.8") { $needUv = $false; Write-Host "uv $uvVer already satisfies 0.8.8" }
  else { Write-Host "uv $uvVer does not satisfy 0.8.8, will reinstall" }
} catch { Write-Host "uv not found, will install 0.8.8" }
if ($needUv) {
  Write-Host "Installing uv 0.8.8..."
  powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
  $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User") + ";" + "$env:USERPROFILE\.cargo\bin"
  try { uv self update --version 0.8.8 } catch { Write-Host "uv self update failed, continuing with installed version" }
}
uv --version
$uvVer = (uv --version)
if (-not ($uvVer -match "0\.8\.8")) { throw "uv 0.8.8 required, found $uvVer - check astral-sh/setup-uv@v6 pin" }

Write-Host "[setup.win32] Syncing Python environment..."
uv lock --project python --check
uv sync --project python --locked --group dev --extra test --extra type_stubs

Write-Host "[setup.win32] Verifying pinned Voxy artifact (PowerShell-native, no bash/jq)..."
$manifest = Get-Content .ci/voxy-artifact.json -Raw | ConvertFrom-Json
$sourcePath = $manifest.path
$expectedSha = $manifest.sha256.ToLower()
if (-not (Test-Path $sourcePath)) { throw "Voxy artifact not found at $sourcePath" }
$actualSha = (Get-FileHash -Algorithm SHA256 $sourcePath).Hash.ToLower()
if ($actualSha -ne $expectedSha) { throw "Voxy sha256 mismatch: expected $expectedSha got $actualSha for $sourcePath" }
Write-Host "Voxy artifact verified: $sourcePath ($actualSha)"
New-Item -ItemType Directory -Force -Path java/mods | Out-Null
Copy-Item $sourcePath "java/mods/$(Split-Path $sourcePath -Leaf)" -Force
Write-Host "Voxy artifact installed to java/mods/"

Write-Host "[setup.win32] Java 21 required - ensure Temurin 21 is on PATH"
java -version

Write-Host "[setup.win32] Done."
'''

[cleanup]
script = """
set -euo pipefail
echo "[cleanup] Removing ephemeral build outputs..."

# Voxy artifact copy installed to java/mods by .ci/install-voxy.sh install
rm -rf java/mods/voxy-*.jar

# Gradle build outputs
rm -rf java/build
rm -rf java/.gradle

# Python ephemeral env (lockfile preserved)
rm -rf python/.venv

# Node ephemeral (keep cache, remove only if present)
# rm -rf node_modules

echo "[cleanup] Done."
"""
