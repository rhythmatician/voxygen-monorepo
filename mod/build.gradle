plugins {
	id 'fabric-loom' version '1.14.10'
	id 'maven-publish'
	id 'jacoco'
	id 'checkstyle'
	id 'info.solidsoft.pitest' version '1.19.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def voxyArtifact = 'maven.modrinth:fxxUqruK:w33aHXHj'

// Repository configuration moved to settings.gradle with dependencyResolutionManagement
// to avoid conflicts and ensure proper dependency resolution
// However, Fabric Loom requires repositories to be declared in build.gradle
repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = uri('https://api.modrinth.com/maven')
			}
		}
		filter {
			includeModule('maven.modrinth', 'fxxUqruK')
			includeModule('maven.modrinth', 'AANobbMI')
		}
	}
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven { 
		name = 'JitPack'
		url = 'https://jitpack.io' 
	}
	// Add DJL snapshot repository for latest versions
	maven {
		name = 'DJL Snapshot'
		url = 'https://oss.sonatype.org/content/repositories/snapshots/'
	}
}

loom {
	accessWidenerPath = file("src/main/resources/lodiffusion.accesswidener")

	splitEnvironmentSourceSets()

	// Optional local verification convenience. flight-loop.ps1 supplies this
	// property after restoring its disposable FlightTest save.
	if (providers.gradleProperty('flightWorld').isPresent()) {
		def world = providers.gradleProperty('flightWorld').get()
		if (!world.isEmpty()) {
			runs {
				client {
					programArgs "--quickPlaySingleplayer", world
				}
			}
		}
	}
	def autoStartTour = providers.gradleProperty('flightTourAutoStart').map { it.equalsIgnoreCase("true") }.getOrElse(false)
	if (autoStartTour) {
		def timeoutTicks = providers.gradleProperty('flightTourTimeoutTicks').orElse("20000").get()
		def dwellTicks = providers.gradleProperty('flightTourDwellTicks').orElse("200").get()
		def runId = providers.gradleProperty('flightTourRunId').orElse("").get()
		runs {
			client {
				vmArg "-Dlodiffusion.flightTour.autoStart=true"
				vmArg "-Dlodiffusion.flightTour.timeoutTicks=${timeoutTicks}"
				vmArg "-Dlodiffusion.flightTour.dwellTicks=${dwellTicks}"
				vmArg "-Dlodiffusion.flightTour.runId=${runId}"
			}
		}
	}
	def disableRefinementAdmission = providers.gradleProperty('disableRefinementAdmission')
			.map { it.equalsIgnoreCase("true") }.getOrElse(false)
	runs {
		client {
			vmArg "-Dlodiffusion.test.disableRefinementAdmission=${disableRefinementAdmission}"
		}
	}

	mods {
		"lodiffusion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	testImplementation sourceSets.named('client').get().output
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation 'maven.modrinth:AANobbMI:ZPWbiWXz' // sodium 0.8.6 for voxy runtime
	
	// (Distant Horizons dependency removed — now targeting Voxy)

	// JUnit 5 for testing
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Mockito for mocking in tests (5.12.0+ required for Java 21 support)
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'

	// ArchUnit for architecture guardrails (pinned per issue 184)
	testImplementation 'com.tngtech.archunit:archunit:1.5.0'

	// Production code compiles against the pinned real Voxy artifact from Modrinth
	// (0.2.11-alpha) but does not bundle it. Only the voxyIntegrationTest suite
	// receives it at runtime via modVoxyIntegrationTestImplementation.
	modCompileOnly voxyArtifact

	// NBT and MCA library for parsing Minecraft region files (1.18+ compatible)
	// Using JitPack for reliable dependency resolution
	implementation 'com.github.Minestom.Hephaistos:common:2.1.2'

	// Kotlin standard library - required by Hephaistos
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
	
	// DJL (Deep Java Library) for ONNX inference using BOM for version management (updated to 0.30.0 per ONNX integration roadmap)
	implementation platform('ai.djl:bom:0.30.0')
	implementation 'ai.djl:api'
	runtimeOnly 'ai.djl.onnxruntime:onnxruntime-engine'

	// Gson for lightweight JSON config loading (runtime toggle + metrics paths)
	implementation 'com.google.code.gson:gson:2.14.0'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

test {
	useJUnitPlatform()
	// Byte Buddy (used by Mockito inline mock-maker) requires this flag on Java 21+
	// since Mockito 5.1.1 bundles an older Byte Buddy that only officially supports Java 20.
	jvmArgs '-Dnet.bytebuddy.experimental=true'
	finalizedBy jacocoTestReport
}


// Auto-deploy built JAR to run/mods/ after remapJar
tasks.register('deployToRunMods', Copy) {
	group = 'fabric'
	description = 'Copy remapped mod JAR to run/mods/ for testing'
	dependsOn remapJar
	from(remapJar.archiveFile)
	into(file('run/mods'))
}

tasks.named('runClient').configure {
	dependsOn tasks.named('deployToRunMods')
}

// Wire deployToRunMods into the build lifecycle
build.dependsOn deployToRunMods

jacoco {
	toolVersion = "0.8.15"
}

checkstyle {
	toolVersion = '10.21.4'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 100  // Allow some warnings while we incrementally improve compliance
	// ignoreFailures = true
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}

	


afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				// Exclude main mod class and data classes from coverage
				'**/HelloTerrainMod.class'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				minimum = 0.70 // 70% coverage threshold
			}
		}
	}
}

// Lint task for static analysis
tasks.register("lint", JavaCompile) {
	group = "verification"
	description = "Run static analysis with enhanced compiler warnings"

	// Configure the task to use the same source sets as main compilation
	source = sourceSets.main.java
	classpath = sourceSets.main.compileClasspath
	destinationDirectory = layout.buildDirectory.dir("tmp/lint")
		// Enhanced compiler options for static analysis
	options.compilerArgs.addAll([
		'-Xlint:all',           // Enable all warnings
		'-Xlint:-processing',   // Disable annotation processing warnings (too noisy)
		'-Xlint:-serial',       // Disable serialization warnings (not relevant for MC mods)
		'-Xlint:-classfile',    // Disable classfile warnings (Kotlin metadata issues)
		// '-Werror',           // Treat warnings as errors (disabled to allow incremental cleanup)
		'-Xmaxwarns', '100',    // Limit warning count for readability
		'-parameters',          // Include parameter names for reflection
		'-deprecation',         // Show detailed deprecation info
		'-Xlint:unchecked'     // Show detailed unchecked conversion warnings
	])
	options.encoding = 'UTF-8'
	options.release = 25
	options.fork = true
	options.forkOptions.jvmArgs = ['-Xmx1g'] // Ensure enough memory for analysis

	doFirst {
		println "🔍 Running static analysis with enhanced compiler warnings..."
		println "   Source files: ${source.files.size()}"
		println "   Output: ${destinationDirectory.get()}"
	}

	doLast {
		println "✅ Static analysis completed successfully!"
		println "   All source files compiled without warnings or errors."
		println "   Ready for integration with additional tools (SpotBugs, Checkstyle, PMD)"
	}
}

// Make lint run as part of check
check.dependsOn lint
// Guardrail: ordinary unit tests must not statically reference real Voxy.
// Those belong in src/voxyIntegrationTest/java.
tasks.register('verifyUnitTestIsolation') {
	group = 'verification'
	description = 'Fails if src/test/java references me.cortex.voxy (belongs in voxyIntegrationTest).'
	def unitSources = fileTree('src/test/java') {
		include '**/*.java'
		exclude '**/ArchitectureGuardrailsTest.java'
		exclude '**/PackageBoundaryTest.java'
	}
	inputs.files(unitSources)
	doLast {
		def offenders = unitSources.findAll { it.getText('UTF-8').contains('me.cortex.voxy') }
		if (!offenders.isEmpty()) {
			throw new RuntimeException(
				"Real Voxy references belong in src/voxyIntegrationTest/java:\n" +
						 offenders.collect { " - ${project.relativePath(it)}" }.join('\n'))
		}
	}
}

// Shared Voxy artifact identification — single authority for both positive and negative classpath assertions.
// Voxy is identified by Modrinth coordinates: maven.modrinth:fxxUqruK (raw) and remapped.maven.modrinth:fxxUqruK-4b5d3c0a (Yarn-remapped).
// Prefer component-coordinate inspection; filename fallback is secondary.
ext.voxyCoordPredicate = { group, name ->
	(group == 'maven.modrinth' && name == 'fxxUqruK') ||
	(group == 'remapped.maven.modrinth' && name.startsWith('fxxUqruK'))
}
ext.isVoxyFile = { File f ->
	f.name.contains('fxxUqruK') || (f.name.startsWith('voxy-') && f.name.endsWith('.jar'))
}

tasks.named('test') {
	dependsOn tasks.named('verifyUnitTestIsolation')
	doFirst {
		// Prefer resolved coordinate check; fallback to filename for safety.
		def predicate = project.ext.get('voxyCoordPredicate')
		def fileCheck = project.ext.get('isVoxyFile')
		def resolved = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { art ->
			def id = art.moduleVersion.id
			(predicate.call(id.group, id.name) as Boolean)
		}
		if (!resolved.isEmpty()) {
			throw new RuntimeException("Ordinary test runtime must not contain Voxy component: ${resolved.collect { it.moduleVersion.id }}")
		}
		def leaked = classpath.files.findAll { fileCheck.call(it) }
		if (!leaked.isEmpty()) {
			throw new RuntimeException("Ordinary test runtime must not contain Voxy jar: ${leaked}")
		}
	}
}

tasks.matching { it.name == 'voxyIntegrationTest' }.configureEach {
	doFirst {
		def predicate = project.ext.get('voxyCoordPredicate')
		def fileCheck = project.ext.get('isVoxyFile')
		def resolved = configurations.named('voxyIntegrationTestRuntimeClasspath').get().resolvedConfiguration.resolvedArtifacts.findAll { art ->
			def id = art.moduleVersion.id
			(predicate.call(id.group, id.name) as Boolean)
		}
		// Fallback to filename if coordinates not resolved (e.g., flatDir)
		def voxyJars = classpath.files.findAll { fileCheck.call(it) }
		def count = !resolved.isEmpty() ? resolved.size() : voxyJars.size()
		def details = !resolved.isEmpty() ? resolved.collect { it.moduleVersion.id } : voxyJars
		if (count != 1) {
			throw new RuntimeException(
					"Expected exactly one Voxy component on voxyIntegrationTest classpath, found ${count}: ${details} (resolved=${resolved}, files=${voxyJars})")
		}
		// Also ensure no duplicate filename-based Voxy jars
		if (voxyJars.size() != 1 && resolved.isEmpty()) {
			throw new RuntimeException("Voxy jar count mismatch: ${voxyJars}")
		}
	}
}


// publishing is already configured by fabric-loom, just need to add sources and javadoc

// Separate JVM test suite: Voxy-linked headless integration tests run against
// the exact pinned Modrinth artifact; ordinary `test` never sees Voxy.
testing {
	suites {
		voxyIntegrationTest(JvmTestSuite) {
			dependencies {
				implementation project()
				implementation sourceSets.named('client').get().output
			}
			targets {
				all {
					testTask.configure {
						useJUnitPlatform()
						shouldRunAfter tasks.named('test')
						jvmArgs '-Dnet.bytebuddy.experimental=true'
					}
				}
			}
		}
	}
}

// Loom remap wiring for custom source set — declared configuration wiring, no filesystem scan.
// Must run after test suite source sets are created; uses Gradle's lazy configuration to avoid afterEvaluate.
// Loom will remap modVoxyIntegrationTestImplementation artifacts via its declared remap configurations.
loom.createRemapConfigurations(sourceSets.voxyIntegrationTest)

dependencies {
	modVoxyIntegrationTestImplementation voxyArtifact
	voxyIntegrationTestImplementation 'it.unimi.dsi:fastutil:8.5.12'
	voxyIntegrationTestImplementation 'org.ow2.asm:asm:9.7'
	voxyIntegrationTestImplementation 'org.ow2.asm:asm-commons:9.7'
	voxyIntegrationTestImplementation 'org.ow2.asm:asm-util:9.7'
	voxyIntegrationTestImplementation 'org.lwjgl:lwjgl:3.3.6'
	voxyIntegrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	voxyIntegrationTestImplementation 'org.mockito:mockito-core:5.12.0'
	voxyIntegrationTestImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
	voxyIntegrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Extend voxyIntegrationTest classpaths from Loom's mapped classpaths so the suite
// sees Minecraft + Fabric mappings. Do this lazily after configurations are realized,
// but without filesystem discovery. Verify actual collector config names; do not assume
// modVoxyIntegrationTestCompileClasspath exists (splitEnvironmentSourceSets may not create it).
configurations.named('voxyIntegrationTestCompileClasspath') {
	// Loom's remapped configurations are the source of truth; extend from the mapped
	// mod compile classpaths that actually exist in this environment.
	def tryExtend = { String name ->
		def c = configurations.findByName(name)
		if (c != null) extendsFrom(c)
		else logger.lifecycle("voxyIntegrationTestCompileClasspath: optional configuration '${name}' not found, skipping")
	}
	logger.lifecycle("voxyIntegrationTestCompileClasspath wiring: available mod/minecraft configs: ${configurations.names.findAll { it.toLowerCase().contains('minecraft') || it.toLowerCase().contains('mod') }.sort().join(', ')}")
	tryExtend('minecraftNamedCompile')
	tryExtend('minecraftCommonNamedCompile')
	tryExtend('modCompileClasspathMapped')
	tryExtend('modCompileClasspathMainMapped')
	tryExtend('modCompileClasspathClientMapped')
	exclude group: 'maven.modrinth', module: 'fxxUqruK'
}
configurations.named('voxyIntegrationTestRuntimeClasspath') {
	def tryExtend = { String name ->
		def c = configurations.findByName(name)
		if (c != null) extendsFrom(c)
		else logger.lifecycle("voxyIntegrationTestRuntimeClasspath: optional configuration '${name}' not found, skipping")
	}
	logger.lifecycle("voxyIntegrationTestRuntimeClasspath wiring: available mod/minecraft configs: ${configurations.names.findAll { it.toLowerCase().contains('minecraft') || it.toLowerCase().contains('mod') }.sort().join(', ')}")
	tryExtend('minecraftNamedRuntime')
	tryExtend('minecraftCommonNamedRuntime')
	tryExtend('modRuntimeClasspathMainMapped')
	tryExtend('modRuntimeClasspathClientMapped')
	exclude group: 'maven.modrinth', module: 'fxxUqruK'
}

// Only run Voxy integration suite when not isolated — mutation hardening and ordinary unit lanes use -PexcludeVoxyTestRuntime
if (!hasProperty('excludeVoxyTestRuntime')) {
	check.dependsOn tasks.named('voxyIntegrationTest')
}

// ---------------------------------------------------------------------------
// Mutation hardening — J-05 targeted PIT gate (Level / VoxelVolume / InMemoryVolumeWriter)
// Pinned: plugin 1.19.0, PIT core 1.25.8, JUnit5 plugin 1.2.3
// ---------------------------------------------------------------------------
pitest {
	pitestVersion = '1.25.8'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
		'com.rhythmatician.voxygen.semantic.Level',
		'com.rhythmatician.voxygen.semantic.VoxelVolume',
		'com.rhythmatician.voxygen.output.InMemoryVolumeWriter'
	]
	targetTests = [
		'com.rhythmatician.voxygen.semantic.LevelTest',
		'com.rhythmatician.voxygen.semantic.VoxelVolumeTest',
		'com.rhythmatician.voxygen.output.InMemoryVolumeWriterTest'
	]
	threads = 4
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
	failWhenNoMutations = true
	mutationThreshold = 100
	// Line coverage 150/151 (99%) — one defensive throw at InMemoryVolumeWriter:125
	// (if (!batch.isComplete()) throw ...) is unreachable via public contract:
	// commitParentRefinement always records all 8 children, so isComplete is always true.
	// The throw is retained for fail-closed safety but never executes in normal runs.
	// Mutation coverage is 111/111 (100%) and is the authoritative gate; line coverage
	// is set to 99 to allow this single unreachable defensive line while keeping the
	// mutation gate at 100. See InMemoryVolumeWriterTest's comment for rationale.
	coverageThreshold = 99
	// Use default mutators for first tracer — do not enable ALL or experimental
	// Narrow equivalent-mutant exclusions must be method+mutator specific with rationale.
	// Example (uncomment with justification if demonstrably equivalent):
	// excludedMethods = []
	// excludedMutators = []
	// if needed: excludedClasses = [] // never whole target class
	jvmArgs = ['-Dnet.bytebuddy.experimental=true']
	// Ensure PIT only runs the isolated unit suite, not Voxy integration
	mainSourceSets = [sourceSets.main]
	testSourceSets = [sourceSets.test]
}

// Isolated test runtime — ordinary test lanes and PIT must not see Voxy when -PexcludeVoxyTestRuntime is set
if (hasProperty('excludeVoxyTestRuntime')) {
	tasks.matching { it.name == 'voxyIntegrationTest' }.configureEach { enabled = false }
	tasks.named('pitest').configure {
		// PIT already limited to testSourceSets above; ensure no Voxy classpath leakage
		doFirst {
			def leaked = classpath.files.findAll { it.name.contains('fxxUqruK') || (it.name.startsWith('voxy-') && it.name.endsWith('.jar')) }
			if (!leaked.isEmpty()) {
				throw new RuntimeException("PIT classpath must not contain Voxy under -PexcludeVoxyTestRuntime: ${leaked}")
			}
		}
	}
}

// Deterministic verifier over native PIT XML — fails on any disallowed status
tasks.register('verifyPitestReport') {
	group = 'verification'
	description = 'Verifies PIT mutations.xml has no SURVIVED/NO_COVERAGE/TIMED_OUT/MEMORY_ERROR/RUN_ERROR'
	dependsOn tasks.named('pitest')
	doLast {
		def reportDir = file("$buildDir/reports/pitest")
		def xmlFile = new File(reportDir, 'mutations.xml')
		def html = new File(reportDir, 'index.html')
		if (!xmlFile.exists()) throw new RuntimeException("PIT XML report missing at ${xmlFile}")
		if (!html.exists()) throw new RuntimeException("PIT HTML report missing at ${html} — XML and HTML must be preserved")
		// Use Java DOM to avoid Groovy XmlSlurper classloading issues in Gradle 9
		def dbf = javax.xml.parsers.DocumentBuilderFactory.newInstance()
		def db = dbf.newDocumentBuilder()
		def doc = db.parse(xmlFile)
		def nodes = doc.getElementsByTagName('mutation')
		int total = nodes.getLength()
		int killed = 0
		def failingStatuses = ['SURVIVED', 'NO_COVERAGE', 'TIMED_OUT', 'MEMORY_ERROR', 'RUN_ERROR']
		def countsByFailing = [:]
		failingStatuses.each { s -> countsByFailing[s] = 0 }
		def failures = []
		for (int i = 0; i < total; i++) {
			def node = nodes.item(i)
			def status = node.getAttributes().getNamedItem('status')?.getNodeValue() ?: ''
			if (status == 'KILLED') killed++
			if (failingStatuses.contains(status)) {
				countsByFailing[status] = countsByFailing[status] + 1
				def mutatedClass = node.getAttributes().getNamedItem('mutatedClass')?.getNodeValue() ?: ''
				def mutatedMethod = node.getAttributes().getNamedItem('mutatedMethod')?.getNodeValue() ?: ''
				def mutator = ''
				def children = node.getChildNodes()
				for (int j = 0; j < children.getLength(); j++) {
					def child = children.item(j)
					if (child.getNodeName() == 'mutator') { mutator = child.getTextContent(); break }
				}
				def lineNumber = node.getAttributes().getNamedItem('lineNumber')?.getNodeValue() ?: ''
				failures << "${status} ${mutatedClass}.${mutatedMethod} [${mutator}] line ${lineNumber}"
			}
		}
		// Excluded / equivalent counts — only if PIT reports them; do not fabricate
		def excludedAttr = doc.getDocumentElement().getAttribute('excluded')
		boolean hasExcludedCount = excludedAttr != null && !excludedAttr.isEmpty()
		println "=== PIT hardening report ==="
		def expectedTargets = [
			'com.rhythmatician.voxygen.semantic.Level',
			'com.rhythmatician.voxygen.semantic.VoxelVolume',
			'com.rhythmatician.voxygen.output.InMemoryVolumeWriter'
		]
		def expectedTests = [
			'com.rhythmatician.voxygen.semantic.LevelTest',
			'com.rhythmatician.voxygen.semantic.VoxelVolumeTest',
			'com.rhythmatician.voxygen.output.InMemoryVolumeWriterTest'
		]
		println "targetClasses: ${expectedTargets}"
		println "targetTests: ${expectedTests}"
		println "reportDir: ${reportDir}"
		println "generated: ${total}"
		println "killed: ${killed}"
		if (hasExcludedCount) {
			println "excluded/equivalent (as reported by PIT): ${excludedAttr}"
		} else {
			println "excluded/equivalent: n/a (not reported by PIT XML)"
		}
		println "counts by failing status:"
		countsByFailing.each { k, v -> println "  ${k}: ${v}" }
		if (total == 0) throw new RuntimeException("PIT generated 0 mutations — failWhenNoMutations should have failed earlier")
		if (!failures.isEmpty()) {
			println "--- disallowed mutations (${failures.size()}) ---"
			failures.each { println it }
			throw new RuntimeException("PIT hardening failed: ${failures.size()} disallowed mutation(s) with status in ${failingStatuses}")
		}
		println "PIT hardening: all ${total} mutations killed, no disallowed statuses"
	}
}

tasks.register('mutationHardening') {
	group = 'verification'
	description = 'Stable project-owned hardening gate for Level/VoxelVolume/InMemoryVolumeWriter (J-05) — delegates to pitest + verification'
	dependsOn tasks.named('verifyPitestReport')
}

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// resolving dependencies.
	}
}

