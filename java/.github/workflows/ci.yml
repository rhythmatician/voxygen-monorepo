name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Lint job - fastest, fails quickly on code style issues
  lint:
    name: Code Quality & Linting
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew.bat
        run: git update-index --chmod=+x gradlew.bat

      - name: Download DistantHorizons JAR
        # DH 1.21.4 jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]
        # DH API jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          # Download main build artifacts
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20%5B1.21.4%5D" -OutFile "dh-main-artifacts.zip"
          Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force
          
          # Find and copy main JAR
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) {
            Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar"
            Write-Host "Found and copied main JAR: $($mainJar.Name)"
          }
          
          # Download API artifacts  
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip"
          Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force
          
          # Find and copy API JAR
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) {
            Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar"
            Write-Host "Found and copied API JAR: $($apiJar.Name)"
          }
          
          # Fallback: create stub JARs if download failed
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) {
              jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md
          }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) {
              jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md
          }

      - name: Run lint checks
        run: ./gradlew.bat lint

  # Test job - runs tests and generates coverage reports
  test:
    name: Tests & Coverage
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew.bat
        run: git update-index --chmod=+x gradlew.bat

      - name: Download DistantHorizons JAR
        # DH 1.21.4 jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]
        # DH API jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          # Download main build artifacts
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20%5B1.21.4%5D" -OutFile "dh-main-artifacts.zip"
          Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force

          # Find and copy main JAR
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) {
            Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar"
            Write-Host "Found and copied main JAR: $($mainJar.Name)"
          }

          # Download API artifacts
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip"
          Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force

          # Find and copy API JAR
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) {
            Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar"
            Write-Host "Found and copied API JAR: $($apiJar.Name)"
          }

          # Fallback: create stub JARs if download failed
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) {
              jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md
          }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) {
              jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md
          }

      - name: Run tests with coverage
        run: ./gradlew.bat test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

  # Build job - ensures the mod can be built successfully
  build:
    name: Build Mod
    runs-on: windows-2022
    needs: [lint, test]  # Only run if lint and test pass
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew.bat
        run: git update-index --chmod=+x gradlew.bat

      - name: Download DistantHorizons JAR
        # DH 1.21.4 jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]
        # DH API jar: https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          # Download main build artifacts
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20%5B1.21.4%5D" -OutFile "dh-main-artifacts.zip"
          Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force

          # Find and copy main JAR
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) {
            Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar"
            Write-Host "Found and copied main JAR: $($mainJar.Name)"
          }

          # Download API artifacts
          Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip"
          Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force

          # Find and copy API JAR
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) {
            Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar"
            Write-Host "Found and copied API JAR: $($apiJar.Name)"
          }

          # Fallback: create stub JARs if download failed
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) {
              jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md
          }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) {
              jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md
          }

      - name: Build mod JAR
        run: ./gradlew.bat build --exclude-task test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  # CodeQL security scan - runs in parallel with other jobs
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java]  # You can add more if needed (e.g., ['java', 'python'])

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup dependencies (download real JARs for CodeQL)
        run: |
          mkdir -p mods
          echo "Downloading real DistantHorizons JARs for CodeQL analysis..."
          
          # Download main build artifacts
          curl -L "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20%5B1.21.4%5D" -o "dh-main-artifacts.zip"
          unzip -q "dh-main-artifacts.zip"
          
          # Find and copy main JAR
          find . -name "DistantHorizons-fabric-*.jar" -exec cp {} "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" \; -quit
          
          # Download API artifacts  
          curl -L "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -o "dh-api-artifacts.zip"
          unzip -q "dh-api-artifacts.zip"
          
          # Find and copy API JAR
          find . -name "DistantHorizonsApi-*.jar" -exec cp {} "mods/DistantHorizonsApi-4.0.0.jar" \; -quit
          
          # Fallback: create stub JARs if download failed
          if [ ! -f "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" ]; then
              jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md
          fi
          if [ ! -f "mods/DistantHorizonsApi-4.0.0.jar" ]; then
              jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md
          fi
          
          # Verify what we have
          ls -la mods/

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (custom build for CodeQL)
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
