name: Factory CI

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: factory-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify candidate
    runs-on: ubuntu-latest
    outputs:
      human-approval: ${{ steps.plan.outputs.human-approval }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - name: Ensure candidate SHA is available
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: git cat-file -e "$CANDIDATE_SHA" 2>/dev/null || git fetch origin "$CANDIDATE_SHA" --depth=1 || true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Classify exact candidate
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" > changed-files.txt
          npm run --silent ci:oracle -- --command plan --files changed-files.txt | tee plan.json
          node -e "const p=require('./plan.json'); console.log('human-approval='+p.humanApproval.required)" >> "$GITHUB_OUTPUT"

  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - name: Ensure candidate SHA is available
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: git cat-file -e "$CANDIDATE_SHA" 2>/dev/null || git fetch origin "$CANDIDATE_SHA" --depth=1 || true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Verify locked Python environment
        uses: astral-sh/setup-uv@v6
        with: { version: "0.8.8" }
      - run: uv lock --project python --check
      - name: Verify pinned Voxy identity
        run: bash .ci/install-voxy.sh verify
      - name: R-02 Documentation policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: npx tsx .ci/docs-policy.mts --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"

  factory:
    name: Factory policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Bootstrap pinned Sandcastle runtime
        run: npx tsx .sandcastle/sandcastle-bootstrap.mts
      - run: npm run typecheck
      - run: npm test
      - uses: raven-actions/actionlint@v2

  python:
    name: Python engineering and contracts
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.8", enable-cache: true }
      - name: Install Qt runtime libraries
        run: |
          # Azure mirror (azure.archive.ubuntu.com) hangs ~10m in CI (Ign loops).
          # Force main archive + add timeout/retries so apt fails fast instead of infinite hang.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for i in 1 2 3; do
            timeout 60 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update attempt $i failed, retrying..."
            sleep 5
          done
          timeout 120 sudo apt-get install --yes --no-install-recommends libegl1
      - run: uv sync --locked --group dev --extra test --extra type_stubs
      - run: uv run ruff format --check --exclude docs --exclude notebooks --exclude "*.md" --exclude "*.ipynb" .
      - run: uv run ruff check .
      - run: uv run pyright voxel_tree
      - run: uv run pytest voxel_tree --tb=short

  java:
    name: Java build and real Voxy integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: gradle }
      - name: Install pinned real Voxy artifact
        run: bash .ci/install-voxy.sh install
      - run: chmod +x java/gradlew
      - name: Compile against real Voxy
        run: ./gradlew lint compileJava compileClientJava
        working-directory: java
      - name: Run unit, contract, and topology tests
        # No -PexcludeVoxyTestRuntime: JUnit discovery classloads every candidate
        # class to apply even exclude filters, so any Voxy-linked test helper
        # (HeadlessNodeManagerProbe etc.) fails with NoClassDefFoundError when
        # Voxy is absent from the runtime classpath. Local dev never passes this
        # property and is green; keep CI on the same shape.
        run: ./gradlew test
        working-directory: java
      - name: Assemble deployable mod against real Voxy
        run: ./gradlew build -x test
        working-directory: java
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ github.sha }}
          path: java/build/libs/*.jar
          if-no-files-found: error

  cross-language:
    name: Cross-language contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.8", enable-cache: true }
      - run: uv sync --project python --locked --extra test
      - run: uv run --project python pytest python/voxel_tree/contracts/tests python/voxel_tree/utils/tests/test_coords.py --tb=short

  performance:
    name: Deterministic performance guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: gradle }
      - run: bash .ci/install-voxy.sh install
      - run: chmod +x java/gradlew && ./java/gradlew -p java test --tests '*ChunkDataExtractorPerformanceTest'

  security:
    name: Supply-chain review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  protected-root-approval:
    name: Approve protected-root change
    needs: [classify]
    if: needs.classify.outputs.human-approval == 'true'
    environment: factory-control-plane
    runs-on: ubuntu-latest
    steps:
      - run: echo "Protected-root activation approved through protected environment"

  merge-oracle:
    name: Factory / Merge Oracle
    if: always()
    needs:
      [
        classify,
        repository,
        factory,
        python,
        java,
        cross-language,
        performance,
        security,
        protected-root-approval,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - name: Ensure candidate SHA is available
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: git cat-file -e "$CANDIDATE_SHA" 2>/dev/null || git fetch origin "$CANDIDATE_SHA" --depth=1 || true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Identify exact candidate and changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" > changed-files.txt
      - name: Materialize exact-SHA evidence
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          LANE_RESULTS: '{"repository":"${{ needs.repository.result }}","factory":"${{ needs.factory.result }}","python":"${{ needs.python.result }}","java":"${{ needs.java.result }}","cross-language":"${{ needs.cross-language.result }}","performance":"${{ needs.performance.result }}","security":"${{ needs.security.result }}"}'
        run: printf '%s' "$LANE_RESULTS" > lane-results.json && npx tsx .sandcastle/ci-results.mts lane-results.json "$CANDIDATE_SHA" evidence.json
      - name: Decide merge authority
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HUMAN_APPROVED: ${{ needs.classify.outputs.human-approval != 'true' || needs.protected-root-approval.result == 'success' }}
        run: npm run ci:oracle -- --command decide --files changed-files.txt --candidate "$CANDIDATE_SHA" --base "$BASE_SHA" --evidence evidence.json --human-approved "$HUMAN_APPROVED" --issue "${{ github.event.pull_request.number }}" --output factory-evidence-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-evidence-${{ github.sha }}
          path: factory-evidence-manifest.json
          if-no-files-found: warn
