name: Python CI

"on":
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'

jobs:
  test:
    name: Lint + Typecheck + Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black flake8 mypy pytest pytest-cov
      - name: Set PYTHONPATH
        shell: bash
        run: echo "PYTHONPATH=${PYTHONPATH};${GITHUB_WORKSPACE}/python" >> $GITHUB_ENV
      - name: Check formatting black
        shell: bash
        run: black --check .
      - name: Type mypy
        shell: bash
        run: mypy --ignore-missing-imports --explicit-package-bases voxel_tree
      - name: Run unit tests
        shell: bash
        run: pytest --tb=short --disable-warnings
      - name: Check code coverage
        shell: bash
        run: pytest --cov=voxel_tree --cov-report=term-missing

  export_onnx:
    name: Export ONNX + Test Vectors
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal deps export
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install onnx onnxruntime
          # CPU Torch on Windows runners (fallback if not in requirements)
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
      - name: Export model.onnx + model_config.json + test_vectors.npz
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          if [ -f scripts/verify_onnx.py ]; then
            python scripts/verify_onnx.py --out artifacts/model.onnx --vectors artifacts/test_vectors.npz --model-config artifacts/model_config.json || true
          fi
          # Fallback exporter if verify_onnx didn't produce artifacts
          if [ ! -f artifacts/model.onnx ]; then
            python - <<'PY' || true
          import os, json, torch
          try:
              from train.unet3d import UNet3D
              from train.exporter import UNet3DConfig
              cfg = UNet3DConfig()
              model = UNet3D(cfg)
              os.makedirs("artifacts", exist_ok=True)
              dummy = torch.zeros(1,1,8,8,8)
              torch.onnx.export(model, dummy, "artifacts/model.onnx", input_names=["parent_voxel"], output_names=["block_logits","air_mask"], opset_version=17, dynamo=False)
              open("artifacts/model_config.json","w").write(json.dumps({"inputs":[
                {"name":"parent_voxel","shape":[1,1,8,8,8],"dtype":"float32"},
                {"name":"biome_patch","shape":[1,16,16],"dtype":"int64"},
                {"name":"heightmap_patch","shape":[1,1,16,16],"dtype":"float32"},
                {"name":"river_patch","shape":[1,1,16,16],"dtype":"float32"},
                {"name":"y_index","shape":[1],"dtype":"int64"},
                {"name":"lod","shape":[1],"dtype":"int64"}],
                "outputs":[
                {"name":"block_logits","shape":[1,1104,16,16,16],"dtype":"float32"},
                {"name":"air_mask","shape":[1,1,16,16,16],"dtype":"float32"}]}, indent=2))
          except Exception as e:
              print(f"Fallback exporter failed: {e}")
              raise SystemExit(0)
          PY
          fi
          if [ ! -f artifacts/test_vectors.npz ]; then
            python - <<'PY'
          import numpy as np
          np.savez("artifacts/test_vectors.npz", parent_voxel=np.zeros((1,1,8,8,8), np.float32), biome_patch=np.zeros((1,16,16), np.int64), heightmap_patch=np.zeros((1,1,16,16), np.float32), river_patch=np.zeros((1,1,16,16), np.float32), y_index=np.zeros((1,), np.int64), lod=np.ones((1,), np.int64))
          PY
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxeltree-artifacts
          path: python/artifacts/

  djl_verify:
    name: DJL ONNX Runtime Verification
    runs-on: windows-latest
    needs: export_onnx
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxeltree-artifacts
          path: python/artifacts
      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build tiny DJL harness (Maven) & run
        shell: bash
        working-directory: python
        run: |
          set -e
          mkdir -p ci-djl/src/main/java/vt
          cat > ci-djl/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>vt</groupId><artifactId>djl-verify</artifactId><version>1.0</version>
            <dependencies>
              <dependency><groupId>ai.djl</groupId><artifactId>api</artifactId><version>0.27.0</version></dependency>
              <dependency><groupId>ai.djl.onnxruntime</groupId><artifactId>onnxruntime-engine</artifactId><version>0.27.0</version></dependency>
              <dependency><groupId>ai.djl.onnxruntime</groupId><artifactId>onnxruntime-native-auto</artifactId><version>1.16.3</version></dependency>
              <dependency><groupId>com.fasterxml.jackson.core</groupId><artifactId>jackson-databind</artifactId><version>2.17.2</version></dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.11.0</version>
                  <configuration><source>21</source><target>21</target></configuration></plugin>
                <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-dependency-plugin</artifactId><version>3.6.1</version></plugin>
              </plugins>
            </build>
          </project>
          POM
          cat > ci-djl/src/main/java/vt/DjlVerify.java <<'JAVA'
          package vt;
          import ai.djl.Device;
          import ai.djl.Model;
          import ai.djl.inference.Predictor;
          import ai.djl.ndarray.*;
          import ai.djl.ndarray.types.DataType;
          import ai.djl.translate.NoopTranslator;
          import java.nio.file.*;
          import java.util.*;
          public class DjlVerify {
            public static void main(String[] args) throws Exception {
              Path art = Paths.get("artifacts");
              Path onnx = art.resolve("model.onnx");
              if (!java.nio.file.Files.exists(onnx)) throw new java.io.FileNotFoundException("model.onnx missing");
              try (Model m = Model.newInstance("voxeltree", Device.cpu());
                   NDManager man = NDManager.newBaseManager();
                   Predictor<NDList, NDList> p = m.newPredictor(new NoopTranslator())) {
                m.load(onnx, null);
                NDList in = new NDList();
                in.add(man.create(new float[1*1*8*8*8]).reshape(1,1,8,8,8));
                in.add(man.create(new long[1*16*16]).reshape(1,16,16));
                in.add(man.create(new float[1*1*16*16]).reshape(1,1,16,16));
                in.add(man.create(new float[1*1*16*16]).reshape(1,1,16,16));
                in.add(man.create(new long[1]).reshape(1));
                in.add(man.create(new long[1]).reshape(1));
                NDList out = p.predict(in);
                if (out.size() != 2) throw new RuntimeException("Expected 2 outputs got "+out.size());
                if (out.get(0).getShape().dimension() != 5) throw new RuntimeException("block_logits rank 5 expected");
                if (out.get(1).getShape().dimension() != 5) throw new RuntimeException("air_mask rank 5 expected");
                System.out.println("DJL OK. "+out.get(0).getShape()+" "+out.get(1).getShape());
              }
            }
          }
          JAVA
          mvn -f ci-djl/pom.xml -q package -DskipTests
          mvn -f ci-djl/pom.xml -q dependency:copy-dependencies -DoutputDirectory=target/dependency
          java -cp "ci-djl/target/classes:ci-djl/target/dependency/*" vt.DjlVerify
