name: Java CI (monorepo)

"on":
  pull_request:
    branches: [main]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  push:
    branches: [main]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: windows-2022
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission gradlew.bat
        run: git update-index --chmod=+x gradlew.bat
      - name: Download DistantHorizons JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]" -OutFile "dh-main-artifacts.zip" } catch { Write-Host "DH main download failed - will use dummy jar: $_" }
          if (Test-Path "dh-main-artifacts.zip") { Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no main zip to expand" }
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) { Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" }
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip" } catch { Write-Host "DH api download failed - will use dummy jar: $_" }
          if (Test-Path "dh-api-artifacts.zip") { Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no api zip to expand" }
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) { Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar" }
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) { jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) { jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md }
      - name: Run lint checks
        run: ./gradlew.bat lint

  test:
    name: Tests & Coverage
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission gradlew.bat
        run: git update-index --chmod=+x gradlew.bat
      - name: Download DistantHorizons JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]" -OutFile "dh-main-artifacts.zip" } catch { Write-Host "DH main download failed - will use dummy jar: $_" }
          if (Test-Path "dh-main-artifacts.zip") { Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no main zip to expand" }
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) { Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" }
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip" } catch { Write-Host "DH api download failed - will use dummy jar: $_" }
          if (Test-Path "dh-api-artifacts.zip") { Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no api zip to expand" }
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) { Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar" }
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) { jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) { jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md }
      - name: Run tests
        run: ./gradlew.bat test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: java/build/reports/jacoco/test/html/
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: java/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

  build:
    name: Build Mod
    runs-on: windows-2022
    needs: [lint, test]
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission gradlew.bat
        run: git update-index --chmod=+x gradlew.bat
      - name: Download DistantHorizons JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "mods" -Force
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]" -OutFile "dh-main-artifacts.zip" } catch { Write-Host "DH main download failed - will use dummy jar: $_" }
          if (Test-Path "dh-main-artifacts.zip") { Expand-Archive -Path "dh-main-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no main zip to expand" }
          $mainJar = Get-ChildItem -Filter "DistantHorizons-fabric-*.jar" | Select-Object -First 1
          if ($mainJar) { Copy-Item $mainJar.FullName "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" }
          try { Invoke-WebRequest -Uri "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -OutFile "dh-api-artifacts.zip" } catch { Write-Host "DH api download failed - will use dummy jar: $_" }
          if (Test-Path "dh-api-artifacts.zip") { Expand-Archive -Path "dh-api-artifacts.zip" -DestinationPath "." -Force } else { Write-Host "no api zip to expand" }
          $apiJar = Get-ChildItem -Filter "DistantHorizonsApi-*.jar" | Select-Object -First 1
          if ($apiJar) { Copy-Item $apiJar.FullName "mods/DistantHorizonsApi-4.0.0.jar" }
          if (!(Test-Path "mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar")) { jar cf mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C . README.md }
          if (!(Test-Path "mods/DistantHorizonsApi-4.0.0.jar")) { jar cf mods/DistantHorizonsApi-4.0.0.jar -C . README.md }
      - name: Build mod JAR
        run: ./gradlew.bat build --exclude-task test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: java/build/libs/*.jar

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup dependencies (download real JARs for CodeQL)
        run: |
          mkdir -p java/mods
          echo "Downloading real DistantHorizons JARs for CodeQL analysis..."
          curl -L "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=build:%20[1.21.4]" -o "dh-main-artifacts.zip" || echo "DH main download failed - will use dummy jar"
          unzip -q "dh-main-artifacts.zip" || echo "no main zip to unzip"
          find . -name "DistantHorizons-fabric-*.jar" -exec cp {} "java/mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" \; -quit
          curl -L "https://gitlab.com/distant-horizons-team/distant-horizons/-/jobs/artifacts/main/download?job=api" -o "dh-api-artifacts.zip" || echo "DH api download failed - will use dummy jar"
          unzip -q "dh-api-artifacts.zip" || echo "no api zip to unzip"
          find . -name "DistantHorizonsApi-*.jar" -exec cp {} "java/mods/DistantHorizonsApi-4.0.0.jar" \; -quit
          if [ ! -f "java/mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar" ]; then jar cf java/mods/DistantHorizons-fabric-2.3.5-b-dev-1.21.4.jar -C java README.md; fi
          if [ ! -f "java/mods/DistantHorizonsApi-4.0.0.jar" ]; then jar cf java/mods/DistantHorizonsApi-4.0.0.jar -C java README.md; fi
      - name: Grant execute permission to gradlew
        run: chmod +x java/gradlew
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build with Gradle (custom build for CodeQL)
        working-directory: java
        run: ./gradlew build -x test
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
