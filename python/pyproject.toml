[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VoxelTree"
version = "0.1.0"
description = "3-model octree pipeline for vanilla Minecraft terrain generation (LODiffusion)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch>=2.0",
    "torchvision",
    "tqdm",
    "PyYAML",
    "scipy",
    "pyside6>=6.6",
    "onnx",
]

[project.scripts]
voxel-tree = "voxel_tree.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxel_tree*"]

[tool.setuptools.package-data]
"voxel_tree.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["voxel_tree"]
markers = [
    "integration: marks tests that integrate with external systems (Fabric server, etc)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["reference-code", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"voxel_tree/conftest.py" = ["E402"]
"voxel_tree/tasks/preprocessing/harvest.py" = ["E402"]

[tool.uv.sources]
py-qgate = { git = "https://github.com/rhythmatician/py-qgate" }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "py-qgate",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = false
reportPossiblyUnboundVariable = false
reportArgumentType = false
reportCallIssue = false
reportReturnType = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false

