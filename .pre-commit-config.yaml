repos:
  - repo: local
    hooks:
      - id: qgate
        name: Quality Gate
        language: system
        entry: uv run --project python qgate --fix
        types: [python]
        pass_filenames: true
        require_serial: true
      - id: docs-policy
        name: R-02 Documentation policy
        language: system
        entry: npx --yes tsx .ci/docs-policy.mts --base origin/main --candidate HEAD
        types: [markdown]
        pass_filenames: false
        require_serial: true
